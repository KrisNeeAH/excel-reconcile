name: Reconciliation checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up -d --build
      - name: Wait for container and check browser interface
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/health; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8765/health
          curl -fsS http://127.0.0.1:8765/samples | python -c 'import json,sys; assert len(json.load(sys.stdin)) == 12'
          curl -fsS http://127.0.0.1:8765/ | python -c 'import sys; assert "两份 Excel" in sys.stdin.read()'
      - if: always()
        run: docker compose logs && docker compose down
