name: Native desktop candidate builds
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller==6.22.0
      - run: python -m unittest discover -s tests -v
      - run: python build_desktop.py
      - name: Verify standalone CLI export
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then exe=dist/Reconcile/Reconcile.exe; else exe=dist/Reconcile/Reconcile; fi
          "$exe" --config samples/01_intro/config.json --output build/standalone-report.xlsx
          python -c 'from openpyxl import load_workbook; assert len(load_workbook("build/standalone-report.xlsx").sheetnames)==5'
      - uses: actions/upload-artifact@v4
        with:
          name: Reconcile-candidate-${{ runner.os }}-${{ runner.arch }}
          path: dist/Reconcile
